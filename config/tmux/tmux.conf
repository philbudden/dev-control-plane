# Host tmux configuration for the terminal-native dev control plane.
# Keep the default C-b prefix to match unconfigured remote tmux hosts.

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
setw -g mode-keys vi

bind h select-window -t :-
bind l select-window -t :+
bind C-h previous-window
bind C-l next-window
bind s choose-tree -Zw
bind p switch-client -l
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

set -g status-left-length 80
set -g status-right-length 120
set -g status-left '#[bold]#S #[fg=colour244]| #I:#W'
set -g status-right '#[fg=colour244]%Y-%m-%d %H:%M'
